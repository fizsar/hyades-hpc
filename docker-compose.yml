# Hyades: clúster de laboratorio con Slurm. SPDX-License-Identifier: AGPL-3.0-only
x-node: &node
  image: hyades-base:local
  init: true
  restart: unless-stopped
  depends_on:
    init: { condition: service_completed_successfully }
  volumes:
    - secrets:/secrets:ro
    - home:/home
    - images:/srv/images
    - ./config/slurm/slurm.conf:/etc/slurm/slurm.conf:ro
    - ./config/slurm/cgroup.conf:/etc/slurm/cgroup.conf:ro

services:
  # Una sola vez por arranque: secretos (solo la primera vez) y homes.
  init:
    build: .
    image: hyades-base:local
    command: ["init"]
    restart: "no"
    volumes:
      - secrets:/secrets
      - home:/home
      - images:/srv/images
      - ./jobs:/opt/hyades/jobs:ro

  mariadb:
    image: mariadb:11.4@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD_FILE: /secrets/db_password
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: ["--innodb-buffer-pool-size=256M", "--innodb-lock-wait-timeout=900", "--innodb-log-file-size=64M"]
    volumes:
      - secrets:/secrets:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  control:
    <<: *node
    hostname: control
    command: ["control"]
    depends_on:
      init: { condition: service_completed_successfully }
      mariadb: { condition: service_healthy }

  compute1: &compute
    <<: *node
    hostname: compute1
    command: ["compute"]
    # Solo los nodos de cálculo: Apptainer necesita user namespaces y Docker los bloquea por defecto.
    privileged: true
  compute2:
    <<: *compute
    hostname: compute2
  compute3:
    <<: *compute
    hostname: compute3

  login:
    <<: *node
    hostname: login
    command: ["login"]
    ports:
      - "127.0.0.1:2222:22"

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
      prometheus: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /secrets/grafana_password
      # Laboratorio: lectura anónima del panel (solo en 127.0.0.1); administrar exige la contraseña.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hyades.json
    volumes:
      - secrets:/secrets:ro
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  promdata:
  grafanadata:
  secrets:
  home:
  images:
  dbdata:
