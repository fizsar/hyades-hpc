# Hyades: configuración de Slurm común a todos los nodos.
ClusterName=hyades
SlurmctldHost=control
SlurmUser=slurm
SlurmdUser=root
SlurmctldPort=6817
SlurmdPort=6818
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld

AuthType=auth/munge
CryptoType=crypto/munge
MpiDefault=none

# En contenedores no gestionamos cgroups: seguimiento de procesos simple.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SlurmdParameters=config_overrides

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# Contabilidad (slurmdbd + MariaDB)
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=control
AccountingStoragePort=6819
AccountingStorageEnforce=associations,limits,qos
AccountingStorageTRES=cpu,mem,node
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
JobCompType=jobcomp/none

# Prioridad multifactor con fairshare
PriorityType=priority/multifactor
PriorityDecayHalfLife=7-0
PriorityWeightFairshare=10000
PriorityWeightQOS=5000
PriorityWeightAge=1000

# Tres estrellas del cúmulo: 2 CPUs lógicas cada una (los contenedores comparten el host).
NodeName=compute[1-3] CPUs=2 RealMemory=1500 State=UNKNOWN

PartitionName=debug Nodes=compute[1-3] MaxTime=00:10:00 DefaultTime=00:05:00 QOS=debug State=UP
PartitionName=batch Nodes=compute[1-3] MaxTime=1-00:00:00 DefaultTime=01:00:00 QOS=batch Default=YES State=UP
