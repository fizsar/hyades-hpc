# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mpi:
    name: cluster up + MPI pi
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the cluster (without the AI image, which takes minutes)
        run: |
          docker compose up -d --build
          scripts/wait-ready.sh
      - name: Run the MPI pi job as an unprivileged user
        run: scripts/ci-mpi.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop
        if: always()
        run: docker compose down -v
